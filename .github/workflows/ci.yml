name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test 01-firewall-rule-auditor
        working-directory: 01-firewall-rule-auditor
        run: |
          pip install -e ".[dev]"
          pytest -q
      - name: Smoke-test CLI gate (bad config must fail, hardened must pass)
        working-directory: 01-firewall-rule-auditor
        run: |
          ! fwaudit audit samples/iptables_bad.rules --fail-on high --no-color > /dev/null
          fwaudit audit samples/iptables_hardened.rules --fail-on low --no-color
      - name: Test 02-network-scanner
        working-directory: 02-network-scanner
        run: |
          pip install -e ".[dev]"
          pytest -q
      - name: Lab smoke test (scanner must find the simulated vulnerable services)
        working-directory: 02-network-scanner
        run: |
          python lab/fake_services.py &
          sleep 2
          ! netrecon scan 127.0.0.1 -p 2121,2222,2323,2525,3307,6380,8080 --fail-on critical --no-color > /dev/null
          netrecon scan 8.8.8.8 -p 53 || [ $? -eq 3 ]

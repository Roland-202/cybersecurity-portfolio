[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fwaudit"
version = "0.1.0"
description = "Firewall rule validator and hardening auditor for Cisco IOS ACLs and iptables"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["security", "firewall", "audit", "cisco", "iptables", "grc", "compliance"]
dependencies = []          # standard library only

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
fwaudit = "fwaudit.cli:main"

[tool.setuptools.packages.find]
include = ["fwaudit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

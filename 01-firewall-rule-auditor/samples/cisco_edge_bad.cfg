hostname EDGE-RTR-01
!
ip access-list extended OUTSIDE_IN
 remark --- inbound from internet ---
 permit tcp any host 203.0.113.10 eq 443
 permit tcp any host 203.0.113.10 eq www
 permit tcp any any eq telnet
 permit tcp any any eq 22
 permit tcp any host 203.0.113.20 eq 3389
 permit udp any any eq snmp
 permit tcp any any range 1024 65535
 permit icmp any any
 permit tcp any host 203.0.113.10 eq 443
 permit ip any any
 deny ip any any
!
ip access-list extended DMZ_OUT
 permit tcp 10.10.20.0 0.0.0.255 any eq 443
 permit tcp 10.10.20.0 0.0.0.255 any eq 80
 permit udp 10.10.20.0 0.0.0.255 any eq domain
 permit tcp 10.10.20.0 0.0.0.255 any eq 8080
!
ip access-list extended LEGACY_VENDOR_ACL
 permit tcp host 198.51.100.7 host 10.10.20.5 eq 1433
 deny ip any any log
!
interface GigabitEthernet0/0
 description UPLINK-INTERNET
 ip address 203.0.113.1 255.255.255.252
 ip access-group OUTSIDE_IN in
!
interface GigabitEthernet0/1
 description DMZ
 ip address 10.10.20.1 255.255.255.0
 ip access-group DMZ_OUT in
!
line vty 0 4
 transport input telnet ssh
!
